openapi: 3.0.0
info:
  title: Release contract fixture
  version: "1.0.0"
paths:
  /test:
    get:
      operationId: testConversionTool
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: available
      responses:
        "200":
          description: A deterministic fixture response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
