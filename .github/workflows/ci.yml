name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-py314:
    name: quality-py314
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Set up Node.js for compatibility fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Check release impact and compatibility
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_automation.py check-pr --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/release-evidence.json"

      - name: Retain release evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/release-evidence.json
          retention-days: 90
          if-no-files-found: error

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run Python test suite
        run: uv run pytest

  docs:
    name: docs
    needs: quality-py314
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Build docs strictly
        run: NO_MKDOCS_2_WARNING=1 uv run mkdocs build --strict

  package:
    name: package
    needs: quality-py314
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build distribution artifacts
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Check installed wheel CLI
        run: uvx --from dist/*.whl openapi-to-mcp --help

  e2e-generated-server:
    name: e2e-generated-server (node-${{ matrix.node-version }})
    needs: quality-py314
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Run generated-server E2E
        run: |
          TMP_ROOT="${{ github.workspace }}/.tmp/e2e-node-${{ matrix.node-version }}" \
          KEEP_TMP=1 \
          bash scripts/e2e_generated_server.sh

      - name: Upload generated-server E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-generated-server-node-${{ matrix.node-version }}
          path: ${{ github.workspace }}/.tmp/e2e-node-${{ matrix.node-version }}
          if-no-files-found: ignore

      - name: Clean generated-server E2E temp files
        if: always()
        run: rm -rf "${{ github.workspace }}/.tmp/e2e-node-${{ matrix.node-version }}"

  e2e-cli-matrix:
    name: e2e-cli-matrix
    needs: quality-py314
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Run CLI E2E matrix
        run: |
          TMP_ROOT="${{ github.workspace }}/.tmp/e2e-cli" \
          KEEP_TMP=1 \
          bash scripts/e2e_cli_matrix.sh

      - name: Upload CLI E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-cli-matrix
          path: ${{ github.workspace }}/.tmp/e2e-cli
          if-no-files-found: ignore

      - name: Clean CLI E2E temp files
        if: always()
        run: rm -rf "${{ github.workspace }}/.tmp/e2e-cli"
