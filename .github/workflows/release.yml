name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-bump:
    name: detect-version-bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      version: ${{ steps.detect.outputs.version }}
      release_reason: ${{ steps.detect.outputs.release_reason }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/detect_release.py

  build-release:
    name: build-release
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Run Python test suite
        run: uv run pytest

      - name: Build distribution artifacts
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Check installed wheel CLI
        run: uvx --from dist/*.whl openapi-to-mcp --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: pypi-publish
    needs: [detect-version-bump, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/openapi-to-mcp-cli
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: github-release
    needs: [detect-version-bump, pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/

      - name: Ensure release tag exists on current master commit
        env:
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        run: |
          existing_ref="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
          if [[ -z "${existing_ref}" ]]; then
            git tag "${TAG_NAME}" "${GITHUB_SHA}"
            git push origin "${TAG_NAME}"
            exit 0
          fi
          if [[ "${existing_ref}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${TAG_NAME} already exists on a different commit: ${existing_ref}" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
            exit 0
          fi
          gh release create "${TAG_NAME}" dist/* \
            --generate-notes \
            --title "${TAG_NAME}" \
            --target "${GITHUB_SHA}"
