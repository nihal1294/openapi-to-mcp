name: release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  detect-version-bump:
    name: detect-version-bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      version: ${{ steps.detect.outputs.version }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/detect_release.py

      - name: Set up Python 3.14
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Set up uv
        if: steps.detect.outputs.should_release == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Node.js for compatibility fixtures
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Verify human-merged release PR and its evidence
        if: steps.detect.outputs.should_release == 'true'
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/release_automation.py authorize --repository "$REPOSITORY" --sha "$GITHUB_SHA"

  build-release:
    name: build-release
    needs: detect-version-bump
    if: needs.detect-version-bump.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Verify frozen lock
        run: uv lock --check

      - name: Run Python test suite
        run: uv run pytest

      - name: Build distribution artifacts
        run: uv build

      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Check installed wheel CLI
        run: uvx --from dist/*.whl openapi-to-mcp --help

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  pypi-publish:
    name: pypi-publish
    needs: [detect-version-bump, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/openapi-to-mcp-cli
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: github-release
    needs: [detect-version-bump, pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/

      - name: Ensure release tag exists on current master commit
        env:
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        run: |
          existing_ref="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
          if [[ -z "${existing_ref}" ]]; then
            git tag "${TAG_NAME}" "${GITHUB_SHA}"
            git push origin "${TAG_NAME}"
            exit 0
          fi
          if [[ "${existing_ref}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${TAG_NAME} already exists on a different commit: ${existing_ref}" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release exists; the finalizer will verify its original assets."
            exit 0
          fi
          gh release create "${TAG_NAME}" dist/* \
            --generate-notes \
            --title "${TAG_NAME}" \
            --target "${GITHUB_SHA}"

  finalize-release:
    name: finalize-release
    needs: [detect-version-bump, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Download original distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.detect-version-bump.outputs.tag_name }}
          path: dist/
      - name: Verify publication and complete release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PR: ${{ needs.detect-version-bump.outputs.pr_number }}
          RELEASE_VERSION: ${{ needs.detect-version-bump.outputs.version }}
        run: python scripts/release_automation.py finalize --repository "$REPOSITORY" --pr "$RELEASE_PR" --sha "$GITHUB_SHA" --version "$RELEASE_VERSION" --dist dist
