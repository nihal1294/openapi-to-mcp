name: generated-dependency-audit

on:
  pull_request:
    branches: [master, main]
    paths:
      - openapi_to_mcp/templates/package.json.j2
      - scripts/audit_generated_dependencies.py
      - scripts/generated_dependency_audit.py
      - tests/unit/test_generated_dependency_audit.py
      - .github/workflows/generated-dependency-audit.yml
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm-audit (${{ matrix.transport }}, ${{ matrix.validation }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, streamable-http]
        validation: [input, none]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Sync frozen dependencies
        run: uv sync --dev --frozen
      - name: Audit generated manifests and minimum SDK versions
        run: >-
          uv run python -m scripts.audit_generated_dependencies
          --transport ${{ matrix.transport }}
          --runtime-validation ${{ matrix.validation }}
          --report-file ${{ runner.temp }}/dependency-audit.json
      - name: Retain audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit-${{ matrix.transport }}-${{ matrix.validation }}
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: warn
