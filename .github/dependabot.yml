version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      mcp-major:
        patterns:
          - "mcp"
        update-types:
          - "major"
      python-runtime:
        patterns:
          - "click"
          - "jinja2"
          - "mcp"
          - "openapi-spec-validator"
          - "pyyaml"
          - "requests"
          - "rich"
          - "rich-click"
          - "structlog"
        update-types:
          - "minor"
          - "patch"
      python-development:
        patterns:
          - "pre-commit"
          - "pytest"
          - "pytest-*"
          - "ruff"
      documentation:
        patterns:
          - "mkdocs"
          - "mkdocs-material"
      build-system:
        patterns:
          - "hatchling"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
