services:
  mock-api:
    image: node:24-bookworm-slim
    user: node
    command: [node, /app/mock-api.mjs]
    volumes:
      - ./mock-api.mjs:/app/mock-api.mjs:ro
    environment:
      EXAMPLE_API_KEY: ${EXAMPLE_API_KEY:-local-example-key}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
  mcp:
    build:
      context: ${MCP_CONTAINER_DIR:?Generate the server and set MCP_CONTAINER_DIR first}
    init: true
    ports:
      - "127.0.0.1:${MCP_CONTAINER_PORT:-8080}:8080"
    environment:
      TARGET_API_BASE_URL: http://mock-api:8081
      AUTH_DEMO_API_KEY: ${EXAMPLE_API_KEY:-local-example-key}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      MCP_ALLOWED_HOSTS: 127.0.0.1,localhost
      MCP_ALLOWED_ORIGINS: http://localhost
    depends_on:
      mock-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/mcp').then(r => process.exit(r.status === 400 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
